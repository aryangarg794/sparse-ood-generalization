_target_: sparse_generalization.models.hypernet.HyperNetSpartan
_partial_: true

inp_dim: 1
out_dim: 1
loss_type: bce
seq_len: 25
num_embeddings: 25
embedding_inp: true
pe_type: sin
model_dim: 32
num_heads: 1
num_mha_layers: 1
include_agg_layer: true
agg_head: eta
hyper_type: mha
use_proj: false
bern_mask: false
layernorm: true
residual: true
dropout: 0.0
separate_mask: false
use_mask: false

weight_gen:
  _partial_: true
  _target_: sparse_generalization.layers.latent_hypernet.LatentHyperNet
  z_dim: 2
  hidden_features: [128, 256]
  eval_draws: 64
  latent_flow: false
  lf_transforms: 3
  lf_hidden: 32
  lf_init: random
  kl_sched: bbb
hyper_bias_init: false
qkscale: 5
eval_chunk: 4

num_modes: 2
mode_reduction: sum
prior_type: none
beta: 0.0

eta_div_coef: 1.0
eta_div_type: cos2
eta_div_target: 0.05
eta_div_floor: squared

div_coeff: 0.0
include_sparsity: false
alpha: 0.1
alpha_min: null
sparse_coef: 1.0
use_optimal_test: false

lr: 3e-5
lr_decay: none
lr_warmup: false
grad_clip: 10000.0
beta1: 0.9
beta2: 0.999
val_freq: 500
