_target_: sparse_generalization.models.hypernet.HyperNetSpartan
_partial_: true

inp_dim: 25
out_dim: 1  #
loss_type: bce  # ce | bce
seq_len: 25
model_dim: 16
num_heads: 1
num_mha_layers: 1
include_agg_layer: true
hyper_type: qk  # mask | mha | mhao | qk
use_proj: true
bern_mask: false
layernorm: false
residual: true
dropout: 0.0
embedding_inp: false
num_embeddings: 25
pe_type: sin  # sin | coord | learned | none
separate_mask: false
use_mask: false

weight_gen:
  _partial_: true
  _target_: sparse_generalization.layers.vae.FlowVAE
  force_vae_gaussian: false
  flow_params:
    n_flows: 3
    hidden_features: [32, 32]
  prior_func:  # called as prior_func(latent_dim, num_modes)
    _partial_: true
    _target_: sparse_generalization.layers.priors.make_unit_gaussian
  # one disjoint Gaussian per mode instead; pins the eval count to num_modes
  # prior_func:
  #   _partial_: true
  #   _target_: sparse_generalization.layers.priors.make_disconnected_prior
  
# weight_gen:
#   _partial_: true
#   _target_: sparse_generalization.layers.vhypernet.VHyperNet
#   hidden_features: [128, 128]

prior_type: nf  # uniform | normal | laplace | nf
prior_params:
  n_flows: 3
  hidden_features: [32, 32]
beta: 1e-2
num_modes: 1
num_eval_samples: 5
use_optimal_test: true
include_sparsity: false
sparse_anneal: false
sparse_start_coef: 1.0
sparse_end_coef: 1.0
sparse_start_decay: 0.0
sparse_end_decay: 1.0
alpha: 0.1
div_coeff: 0.0

div_loss:
  _partial_: true
  _target_: sparse_generalization.layers.diversity_losses.CosineRepDiv

lr: 1e-3
lr_decay: linear  # none | linear
lr_warmup: false
beta1: 0.9
beta2: 0.999
val_freq: 5
